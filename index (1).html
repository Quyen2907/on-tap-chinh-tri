ây dựng đất nước trong thời kỳ quá độ lên CNXH (năm 1991) đã chỉ rõ một trong những đặc trưng của CNXH mà chúng ta xây dựng là:","options":["Có nền văn hóa tiên tiến, đậm đà bản sắc dân tộc","Có nền văn hóa phát triển cao dựa vào lực lượng sản xuất tiên tiến","Có nền văn hóa mang đậm truyền thống dân tộc","Có nền văn hóa giàu tính nhân văn cao cả"],"answer":null,"explanation":"","verified":false},{"id":"q0390","lesson":"BÀI 5","lessonTitle":"Phát triển kinh tế, xã hội, văn hóa, con người ở Việt Nam","number":38,"question":"Cốt lõi xây dựng nền văn hóa Việt Nam tiên tiến là:","options":["Tiếp thu thành tựu văn hóa khoa học – kỹ thuật của các nước trên thế giới làm nền tảng cho công cuộc xây dựng văn hóa hiệu quả","Tiếp thu tư tưởng tinh hoa văn hóa nhân loại","Bài trừ các tư tưởng phản cách mạng","Có lý tưởng độc lập dân tộc và chủ nghĩa xã hội theo Chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh"],"answer":null,"explanation":"","verified":false},{"id":"q0391","lesson":"BÀI 5","lessonTitle":"Phát triển kinh tế, xã hội, văn hóa, con người ở Việt Nam","number":39,"question":"Chọn phương án trả lời đúng nhất. Chính sách xã hội nhằm hướng tới lĩnh vực:","options":["Văn hóa","Chính trị","Kinh tế","Xã hội"],"answer":null,"explanation":"","verified":false},{"id":"q0392","lesson":"BÀI 5","lessonTitle":"Phát triển kinh tế, xã hội, văn hóa, con người ở Việt Nam","number":40,"question":"Cần bồi dưỡng các giá trị văn hóa trong thanh niên, học sinh, sinh viên là:","options":["Lý tưởng sống","Lý tưởng mục tiêu, lối sống, đạo đức","Lý tưởng sống, lối sống, năng lực, trí tuệ, đạo đức và bản lĩnh văn hóa con người Việt Nam","Năng lực, trí tuệ và con người Việt Nam trong bối cảnh hội nhập kinh tế quốc tế và thu hút vốn đầu tư nước ngoài vào Việt Nam"],"answer":null,"explanation":"","verified":false},{"id":"q0393","lesson":"BÀI 5","lessonTitle":"Phát triển kinh tế, xã hội, văn hóa, con người ở Việt Nam","number":41,"question":"Đảng khẳng định nhân tố quyết định sự phát triển là:","options":["Vốn","Hàng hóa","Khoa học công nghệ","Con người"],"answer":null,"explanation":"","verified":false},{"id":"q0394","lesson":"BÀI 5","lessonTitle":"Phát triển kinh tế, xã hội, văn hóa, con người ở Việt Nam","number":42,"question":"Đảng ta tiến hành cách mạng xã hội nhằm mục đích cao nhất là:","options":["Giải phóng dân tộc","Giải phòng dân tộc, giải phóng xã hội và giải phóng con người","Giải phóng giai cấp, giải quyết các mâu thuẫn vốn có trong nước để giành độc lập cho dân tộc","Giải phóng xã hội và tiến lên Chủ nghĩa cộng sản văn minh"],"answer":null,"explanation":"","verified":false},{"id":"q0395","lesson":"BÀI 5","lessonTitle":"Phát triển kinh tế, xã hội, văn hóa, con người ở Việt Nam","number":43,"question":"Khái niệm chính sách xã hội được Đảng ta chính thức đề cập và đưa vào văn kiện từ Đại hội:","options":["Đại hội VI (1986)","Đại hội VII (1991)","Đại hội VIII (1996)","Đại hội IX (2001) MỤC TIÊU 3: Sinh viên có thái độ đúng đắn, khoa học về những vấn đề kinh tế, xã hội, văn hóa, con người Việt Nam trong thời đại mới Mức độ tổng hợp, đánh giá và vận dụng:"],"answer":null,"explanation":"","verified":false},{"id":"q0396","lesson":"BÀI 5","lessonTitle":"Phát triển kinh tế, xã hội, văn hóa, con người ở Việt Nam","number":44,"question":"Quan điểm “Việt Nam muốn làm bạn với các nước dân chủ không gây thù oán với một ai” là:","options":["Lê Duẩn","Võ Nguyên Giáp","Hồ Chí Minh","Phạn Văn Đồng"],"answer":null,"explanation":"","verified":false},{"id":"q0397","lesson":"BÀI 5","lessonTitle":"Phát triển kinh tế, xã hội, văn hóa, con người ở Việt Nam","number":45,"question":"Trong các nội dung chủ yếu sau đây của đấu tranh giai cấp ở nước ta hiện nay, theo quan điểm của Đại hội IX của Đảng nội dung chủ yếu nhất là:","options":["Làm thất bại âm mưu Diễn biến hòa bình","Đấu tranh chống tệ nạn xã hội và các thế lực thù địch","Chống áp bức bất công, thực hiện công bằng xã hội","Thực hiên thắng lợi sự nghiệp công nghiệp hóa, hiện đại hóa đất nước"],"answer":null,"explanation":"","verified":false},{"id":"q0398","lesson":"BÀI 5","lessonTitle":"Phát triển kinh tế, xã hội, văn hóa, con người ở Việt Nam","number":46,"question":"“ Yêu Tổ quốc: cái gì trái với quyền lợi của Tổ quốc, chúng ta kiên quyết chống lại. Yêu nhân dân: việc gì hay người nào phạm đến lợi ích chung của nhân dân, chúng ta kiên quyết chống lại. Yêu lao động: ai khinh rẻ lao động, chúng ta kiên quyết chống lại. Yêu khoa học: cái gì trái với khoa học, chúng ta kiên quyết chống lại. Yêu đạo đức: chúng ta phải thực hiện đức tính trong sạch, chất phác, hăng hái, cần kiệm; xoá bỏ hết những vết tích nô lệ trong tư tưởng và hành động”’ là của:","options":["Hồ Chí Minh","Võ Nguyên Giáp","Các Mác","Ăng ghen"],"answer":null,"explanation":"","verified":false},{"id":"q0399","lesson":"BÀI 5","lessonTitle":"Phát triển kinh tế, xã hội, văn hóa, con người ở Việt Nam","number":47,"question":"“Cũng như sông thì có nguồn mới có nước, không có nguồn thì sông cạn. Cây phải có gốc, không có gốc thì cây héo. Người cách mạng phải có đạo đức, không có đạo đức thì dù tài giỏi mấy cũng không lãnh đạo được nhân dân.” Là của :","options":["Hồ Chí Minh","Võ Nguyên Giáp","Các Mác","Ăng ghen"],"answer":null,"explanation":"","verified":false},{"id":"q0400","lesson":"BÀI 5","lessonTitle":"Phát triển kinh tế, xã hội, văn hóa, con người ở Việt Nam","number":48,"question":"“Bảo đảm sự lãnh đạo thống nhất của Đảng, sự quản lý tập trung của Nhà nước đối với các hoạt động đối ngoại. Phối hợp chặt chẽ hoạt động đối ngoại của Đảng, ngoại giao Nhà nước và đối ngoại nhân dân; giữa ngoại giao chính trị với ngoại giao kinh tế và ngoại giao văn hóa; giữa đối ngoại với quốc phòng, an ninh.” là:","options":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021) BÀI 6 TĂNG CƯỜNG QUỐC PHÒNG AN NINH, MỞ RỘNG QUAN HỆ ĐỐI NGOẠI VÀ HỘI NHẬP QUỐC TẾ Ở NƯỚC TA HIỆN NAY Mục tiêu bài học MỤC TIÊU 1: Trình bày được bối cảnh của Việt Nam và quốc tế hiện nay; Quan điểm và những nhiệm vụ chủ yếu của đường lối quốc phòng, an ninh. Mức độ nhớ"],"answer":null,"explanation":"","verified":false},{"id":"q0401","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":1,"question":"Một trong những vấn đề toàn cầu hiện nay là:","options":["An ninh lương thực","Bạo lực gia đình","Phân biệt giới tính","Sống ảo"],"answer":null,"explanation":"","verified":false},{"id":"q0402","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":2,"question":"Một trong những vấn đề toàn cầu hiện nay là:","options":["Biến đổi khí hậu","Bạo lực mạng","Tranh chấp tài nguyên, khoáng sản","Phân biệt giới tính"],"answer":null,"explanation":"","verified":false},{"id":"q0403","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":3,"question":"Đâu là một trong 4 nguy cơ mà Hội nghị đại biểu Toàn quốc của Đảng giữa nhiệm kỳ khoá VII tháng 1/1994 đã chỉ ra?","options":["Tụt hậu về kinh tế","Di cư tự do","Cạn kiệt nguồn tài nguyên khoáng sản","An ninh phi truyền thống"],"answer":null,"explanation":"","verified":false},{"id":"q0404","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":4,"question":"Hội nghị đại biểu Toàn quốc của Đảng giữa nhiệm kỳ khoá VII tháng 1/1994 đã chỉ ra mấy nguy cơ đang tồn tại với cách mạng Việt Nam hiện nay?","options":["01 nguy cơ","02 nguy cơ","03 nguy cơ","04 nguy cơ"],"answer":null,"explanation":"","verified":false},{"id":"q0405","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":5,"question":"Đâu là một trong 4 nguy cơ mà Hội nghị đại biểu Toàn quốc của Đảng giữa nhiệm kỳ khoá VII tháng 1/1994 đã chỉ ra?","options":["“Diễn biến hòa bình” của các thế lực thù địch","Nguy cơ an ninh lương thực","Nguy cơ dịch bệnh","Nguy cơ thiên tai"],"answer":null,"explanation":"","verified":false},{"id":"q0406","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":6,"question":"Đâu là một trong 4 nguy cơ mà Hội nghị đại biểu Toàn quốc của Đảng giữa nhiệm kỳ khoá VII tháng 1/1994 đã chỉ ra?","options":["Nguy cơ chiến tranh, xâm phạm chủ quyền độc lập dân tộ","Nguy cơ an ninh phi truyền thống ảnh hưởng đến sự phát triển tiến lên chủ nghĩa xã hội","Nguy cơ an ninh truyền thống ảnh hưởng đến sự nghiệp phát triển tiến lên chủ nghĩa xã hội của Việt Nam","Chệch hướng xã hội chủ nghĩa"],"answer":null,"explanation":"","verified":false},{"id":"q0407","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":7,"question":"Đâu là một trong 4 nguy cơ mà Hội nghị đại biểu Toàn quốc của Đảng giữa nhiệm kỳ khoá VII tháng 1/1994 đã chỉ ra?","options":["Tham nhũng và các tệ nạn xã hội","Nguy cơ chiến tranh xâm lược","Nguy cơ khan hiếm lương thực","Nguy cơ khủng bố"],"answer":null,"explanation":"","verified":false},{"id":"q0408","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":8,"question":"Hội nghị Trung ương 8, khoá XI (10/2013) đã xác định quan điểm nào về quốc phòng, an ninh trong tình hình mới?","options":["Chăm lo nâng cao phẩm chất cách mạng, trình độ chính trị, chuyên môn, nghiệp vụ cho cán bộ, chiến sĩ.","Giữ vững và tăng cường sự lãnh đạo của Đảng, hiệu lực quản lý của Nhà nước đối với sự nghiệp bảo vệ Tổ quốc","Tăng cường quốc phòng, giữ vững an ninh quốc gia, trật tự, an toàn xã hội là nhiệm vụ trọng yếu.","Quan hệ đối ngoại được mở rộng nhằm tăng cường mở rộng mối quan hệ trong quốc phòng, an ninh."],"answer":null,"explanation":"","verified":false},{"id":"q0409","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":9,"question":"Hội nghị Trung ương 8, khoá XI (10/2013) đã xác định quan điểm nào về quốc phòng, an ninh trong tình hình mới?","options":["Kiên định mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội","Kiên định mục tiêu dân giàu, nước mạnh, xã hội công bằng, văn minh","Kiên định hội nhập kinh tế quốc tế trong tình hình mới","Toàn quân dân Việt Nam đoàn kết để xây dựng nền quốc phòng toàn dân"],"answer":null,"explanation":"","verified":false},{"id":"q0410","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":10,"question":"Hội nghị Trung ương 8, khoá XI (10/2013) đã xác định quan điểm nào về quốc phòng, an ninh trong tình hình mới?","options":["Tăng cường quốc phòng, giữ vững an ninh quốc gia, trật tự, an toàn xã hội.","Xây dựng thế trận quốc phòng toàn dân, kết hợp chặt chẽ với thế trận an ninh nhân dân vững chắ","Kết hợp sức mạnh dân tộc với sức mạnh thời đại, tranh thủ sự ủng hộ của bạn bè quốc tế","Phát triển kinh tế - xã hội đi đôi với tăng cường sức mạnh quốc phòng – an ninh."],"answer":null,"explanation":"","verified":false},{"id":"q0411","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":11,"question":"Hội nghị Trung ương 8, khoá XI (10/2013) đã xác định quan điểm nào về quốc phòng, an ninh trong tình hình mới?","options":["Phát huy cao nhất sức mạnh tổng hợp của đất nước, nhất là vai trò của nhân dân đối với sự nghiệp bảo vệ Tổ quốc","Đổi mới, hoàn thiện thể chế để tăng cường quốc phòng, an ninh trong tình hình mới","Chủ động mở rộng hợp tác về quốc phòng an ninh với các nước trên thế giới","Chủ động đón nhận cơ hội phát triển để tăng cường quốc phòng, an ninh trong tình hình mới."],"answer":null,"explanation":"","verified":false},{"id":"q0412","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":12,"question":"Trong nhiệm vụ chủ yếu thực hiện đường lối quốc phòng, an ninh, đâu là một trong năm mục tiêu mà nghị quyết trung ương 8 khoá XI (10/2013) đã chỉ ra?","options":["Giữ vững kỷ cương tăng cường pháp chế","Tạo được chuyển biến rõ rệt, khắc phục được những hạn chế, yếu kém trong công tác xây dựng Đảng, xây dựng Nhà nướ","Củng cố và hoàn thiện khối liên minh công nông tri thức","Giữ gìn bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trước những mối đe doạ bên trong và bên ngoài"],"answer":null,"explanation":"","verified":false},{"id":"q0413","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":13,"question":"Trong nhiệm vụ chủ yếu thực hiện đường lối quốc phòng, an ninh, đâu là một trong năm mục tiêu mà nghị quyết trung ương 8 khoá XI (10/2013) đã chỉ ra?","options":["Hợp tác quân sự với các nước xã hội chủ nghĩa trên thế giới","Quan hệ quốc tế sâu rộng để tăng cường quốc phòng an ninh","Chính trị - xã hội ổn định, dân chủ, kỷ cương, đồng thuận được củng cố; đời sống vật chất và tinh thần của nhân dân được nâng lên rõ rệt","Học hỏi kinh nghiệm quân sự của tất cả các nước trên thế giới"],"answer":null,"explanation":"","verified":false},{"id":"q0414","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":14,"question":"Trong nhiệm vụ chủ yếu thực hiện đường lối quốc phòng, an ninh, đâu là một trong năm mục tiêu mà nghị quyết trung ương 8 khoá XI (10/2013) đã chỉ ra?","options":["Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa là mục tiêu chiến lước của quốc phòng, an ninh ở nước ta hiện nay","Đấu tranh bảo vệ Tổ quốc xã hội chủ nghĩa Việt Nam là mục tiêu hàng đầu của quốc phòng, an ninh nhân dân.","Chống lại những quan điểm sai trái chống phá Nhà nước","Tập trung phát triển các ngành công nghiệp cơ bản, tạo nền tảng cho công nghiệp hoá, hiện đại hoá, cho công nghiệp quốc phòng, an ninh."],"answer":null,"explanation":"","verified":false},{"id":"q0415","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":15,"question":"Trong nhiệm vụ chủ yếu thực hiện đường lối quốc phòng, an ninh, đâu là một trong năm mục tiêu mà nghị quyết trung ương 8 khoá XI (10/2013) đã chỉ ra?","options":["Khác phục được tình trạng sơ hở, mất cảnh giác; ngăn ngừa làm thất bại âm mưu, hoạt động chống phá của các thế lực thù địch","Hoàn thiện chức năng, nhiệm vụ và cơ cấu tổ chức cảu lực lượng Công an nhân dân, đáp ứng yêu cầu, nhiệm vụ bảo vệ Tổ quốc trong tình hình mới.","Chú trọng xây dựng lực lượng dân quân tự vệ vững mạnh, rộng khắp, lực lượng dự bị động viên hùng hậu, có chất lượng cao.","Xây dựng sức mạnh quân sự phải coi trọng nhiều yếu tố; trong đó, xây dựng lực lượng vũ trang gồm Quân đội nhân dân và Công an nhân dân vững mạnh"],"answer":null,"explanation":"","verified":false},{"id":"q0416","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":16,"question":"Trong nhiệm vụ chủ yếu thực hiện đường lối quốc phòng, an ninh, đâu là một trong năm mục tiêu mà nghị quyết trung ương 8 khoá XI (10/2013) đã chỉ ra?","options":["Kinh tế được để cao để gia tăng tiềm lực cho quốc phòng, an ninh","Bảo đảm an ninh trên các lĩnh vực, kiềm chế gia tăng tội phạm, tạo chuyển biến rõ rệt về trật tự an toàn xã hội","Văn hóa – xã hội đóng vai trò quan trọng trong việc tuyên truyền nhân trong thực hiện đường lối quốc phòng, an ninh","Giáo dục nhân dân thực hiện nghiêm túc đường lối quốc phòng, an ninh nhân dân"],"answer":null,"explanation":"","verified":false},{"id":"q0417","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":17,"question":"Đại hội đại biểu toàn quốc lần thứ XII của Đảng (1/2016) khẳng định phương hướng, nhiệm vụ quốc phòng, an ninh hiện nay là gì?","options":["Xây dựng, củng cố đường biên giới trên bộ hoà bình, hữu nghị, hợp tác và phát triển","Xây dựng khối liên minh công - nông - tri thức","Hợp tác, bình đẳng, đa phương hoá, đa dạng hoá trong các quan hệ về quốc phòng, an ninh","Đôi bên cùng có lợi, thực hiện hợp tác về quốc phòng, anh ninh."],"answer":null,"explanation":"","verified":false},{"id":"q0418","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":18,"question":"Đâu là một trong những phương hướng, nhiệm vụ quốc phòng, an ninh hiện nay mà Đảng ta đã chỉ ra tại Đại hội đại biểu toàn quốc lần thứ XII (1/2016)?","options":["Tăng cường tiềm lực quốc phòng và an ninh; xây dựng thế trận quốc phòng toàn dân, thế trận an ninh nhân dân vững chắ","Thực hiện nhất quán đường lối đối ngoại độc lập, tự chủ, hoà bình, hợp tác và phát triển.","Bảo đảm an ninh trên các lĩnh vực, kìm chế gia tăng tội phạm, tạo chuyển biến rõ rệt về trật tự an toàn xã hội.","Tập trung phát triển các ngành khoa học cơ bản MỤC TIÊU 2: Trình bày được quan điểm và những nhiệm vụ chủ yếu của đường lối đối ngoại Mức độ nhớ:"],"answer":null,"explanation":"","verified":false},{"id":"q0419","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":19,"question":"Đâu là một trong những phương hướng, nhiệm vụ quốc phòng, an ninh hiện nay mà Đảng ta đã chỉ ra tại Đại hội đại biểu toàn quốc lần thứ XII (1/2016)?","options":["Xây dựng “thế trận lòng dân”, tạo nền tảng vững chắc xây dựng nền quốc phòng toàn dân và nền an ninh nhân dân.","Mục tiêu, nhiệm vụ của quốc phòng, an ninh là bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tô quố","Chủ động, ngăn chặn, làm thất bại mọi âm mưu và hành động chống phá của các thế lực thù địch.","Sự ổn định và phát triển bền vững mọi mặt đời sống kinh tế - xã hội là nền tảng vững chắc của quốc phòng – an ninh."],"answer":null,"explanation":"","verified":false},{"id":"q0420","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":20,"question":"Đâu là một trong những nhiệm vụ chủ yếu của đường lối đối ngoại trong Văn kiện Đại hội XII?","options":["Triển khai mạnh mẽ định hướng chiến lược chủ động và tích cực hội nhập quốc tế","Hội nhập quốc tế là sự nghiệp của toàn dân và của cả hệ thống chính trị dưới sự lãnh đạo của Đảng","Hội nhập quốc tế là quá trình vừa hợp tác vừa đấu tranh","Nghiêm chỉnh tuân thủ các cam kết quốc tế mà Việt Nam tham giA."],"answer":null,"explanation":"","verified":false},{"id":"q0421","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":21,"question":"Đâu là một trong những nhiệm vụ chủ yếu của đường lối đối ngoại trong Văn kiện Đại hội XII?","options":["Chủ động tạo ra mối quan hệ quốc tế thuận lợi để đưa đất nước ta hội nhập","Chú trọng phát triển quan hệ hợp tác, hữu nghị, truyền thông với các nước láng giềng, thúc đẩy quan hệ với các đối tác lớn, đối tác quan trọng.","Đẩy mạnh hoạt động kinh tế đối ngoại đa phương hoá, đa dạng hoá quan hệ đối ngoại với các nước xã hội chủ nghĩ","Tích cực hội nhập kinh tế quốc tế mở rộng giao lưu kinh tế với tất cả các quốc gia trên thế giới."],"answer":null,"explanation":"","verified":false},{"id":"q0422","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":22,"question":"“ Là bạn, là đối tác tin cậy và thành viên có trách nhiệm của cộng đồng quốc tế”. Đây là một trong những nhiệm vụ chủ yếu của đường lối đối ngoại trong Văn kiện nào?","options":["Đại hội X","Đại hội XI","Đại hội XII","Đại hội XIII"],"answer":null,"explanation":"","verified":false},{"id":"q0423","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":23,"question":"Đâu là một trong những nhiệm vụ chủ yếu của đường lối đối ngoại trong Văn kiện Đại hội XII?","options":["Tích cực tham gia các diễn đàn và hoạt động của thế giới","Sẵn sàng đối thoại với các nước về vấn đề kinh tế","Mở rộng hợp tác về kinh tế","Chủ động và tích cực hội nhập quốc tế"],"answer":null,"explanation":"","verified":false},{"id":"q0424","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":24,"question":"Đâu là một trong những nhiệm vụ chủ yếu của đường lối đối ngoại trong Văn kiện Đại hội XII?","options":["Đa phương hóa, đa dạng hóa trong quan hệ đối ngoại","Nâng cao vị thế của nước ta trên thế giới","Tích cực tham gia các diễn đàn về kinh tế trên thế giới","Mở rộng hợp tác kinh tế với các quốc gia trên thế giới"],"answer":null,"explanation":"","verified":false},{"id":"q0425","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":25,"question":"Đâu là một trong những nhiệm vụ chủ yếu của đường lối đối ngoại trong Văn kiện Đại hội XII?","options":["Chủ động tạo ra mối quan hệ quốc tế thuận lợi để đưa đất nước ta hội nhập với thế giới","Bảo đảm sự lãnh đạo thống nhất của Đảng, sự quản lý tập trung của Nhà nước đối với các hoạt động đối ngoại.","Nêu cao tinh thần, tự chủ trong quan hệ đối ngoại","Nêu cao tinh thần, tự chủ trong quan hệ ngoại giao"],"answer":null,"explanation":"","verified":false},{"id":"q0426","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":26,"question":"Việt Nam trở thành thành viên chính thức của Diễn đàn Hợp tác Kinh tế châu Á – Thái Bình Dương ( APFC) năm nào?","options":["1996","1997","1998","1999"],"answer":null,"explanation":"","verified":false},{"id":"q0427","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":27,"question":"Với công dân được đào tạo trình độ cao đẳng, đại học đã được tạm hoãn gọi nhập ngũ thì độ tuổi hết nghĩa vụ quân sự là bao nhiêu?","options":["25 tuổi","26 tuổi","27 tuổi","28 tuổi"],"answer":null,"explanation":"","verified":false},{"id":"q0428","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc alse},{"id":"q0432","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":32,"question":"Anh trai của T có giấy gọi nhập ngũ, nhưng bố mẹ của T không muốn con đi bộ đội nên đã bàn với nhau tìm cách xin cho anh ở lại. Biết được điều này, T nên ứng xử theo cách nào dưới đây để thực hiện trách nhiệm công dân của mình?","options":["Coi như không biết vì đây là việc của bố mẹ","Nói chuyện với bố mẹ để bố mẹ hiểu được trách nhiệm bảo vệ Tổ quốc của công dân","Đồng ý với việc làm đó của bố mẹ","Tìm cách ngăn cản việc làm của bố mẹ"],"answer":null,"explanation":"","verified":false},{"id":"q0433","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":33,"question":"Anh A có hành vi câu kết với người nước ngoài, phát tán tài liệu nói xấu Nhà nướ","options":["Phản bội Tổ quốc","Lật đổ chính quyền nhân dân","Xâm phạm an ninh quốc gia","Cung cấp bí mật Nhà nước cho nước ngoài"],"answer":null,"explanation":"","verified":false},{"id":"q0434","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":34,"question":"Trong hội nhập quốc tế lĩnh vực trọng tâm là:","options":["Hội nhập văn hóa","Hội nhập kinh tế","Hội nhập chính trị","Hội nhập quốc phòng – anh ninh"],"answer":null,"explanation":"","verified":false},{"id":"q0435","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":35,"question":"Độ tuổi bắt đầu thực hiện nghĩa vụ quân sự tại Việt Nam hiện nay là:","options":["18 tuổi","19 tuổi","20 tuổi","21 tuổi"],"answer":null,"explanation":"","verified":false},{"id":"q0436","lesson":"BÀI 6","lessonTitle":"Tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại và hội nhập quốc tế","number":36,"question":"Việt Nam là thành viên của Hiệp hội các Quốc gia Đông Nam Á (ASEAN) vào năm nào?","options":["1994","1995","1996","1997"],"a ion":"","verified":false},{"id":"q0475","lesson":"BÀI 7","lessonTitle":"Xây dựng và hoàn thiện Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam","number":35,"question":"Chọn phương án trả lời đúng. Trong hệ thống chính trị nước ta, cơ quan tư pháp của Nhà nước ta là:","options":["Tòa án nhân dân","Quốc hội","Ủy ban nhân dân","Chính phủ BÀI 8 PHÁT HUY SỨC MẠNH CỦA KHÔI ĐẠI ĐOÀN KẾT TOÀN DÂN TỘC TRONG XÂY DỰNG, BẢO VỆ TỔ QUỐC Mục tiêu bài học MỤC TIÊU 1: Trình bày được tầm quan trọng của đại đoàn kết toàn dân tộc trong xây dựng và bảo vệ Tổ quốc Mức độ nhớ lại :"],"answer":null,"explanation":"","verified":false},{"id":"q0476","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":1,"question":"Thực hiện đoàn kết dân tộc là một nội dung, một nhiệm vụ chiến lược của cách mạng xã hội chủ nghĩa và là một điều kiện tất yếu để thực hiện sứ mệnh lịch sử của giai cấp công nhân, là quan điểm của:","options":["Hồ Chí Minh","V.I.Lênin","Trường Chinh","Chủ nghĩa Mác – Lênin"],"answer":null,"explanation":"","verified":false},{"id":"q0477","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":2,"question":"Chọn phương án trả lời đúng nhất.Theo tư tưởng Hồ Chí Minh, Đoàn kết:","options":["Là thắng lợi, là then chốt","Là thành công","Là chiến thắng","Là tạo ra sức mạnh lớn"],"answer":null,"explanation":"","verified":false},{"id":"q0478","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":3,"question":"“Đại đoàn kết dân tộc trong sự nghiệp cách mạng gồm các nội dung chủ yếu: về vị trí, vai trò, về nội dung, hình thức, nguyên tắc, phương pháp đoàn kết dân tộc” Là quan điểm của:","options":["Hồ Chí Minh","V.I.Lênin","Trường Chinh","Chủ nghĩa Mác – Lênin"],"answer":null,"explanation":"","verified":false},{"id":"q0479","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":4,"question":"“Đoàn kết, đoàn kết, đại đoàn kết. Thành công, thành công, đại thành công”. là câu nói của:","options":["Hồ Chí Minh","V.I.Lênin","Mác","Ph.Ăng ghen"],"answer":null,"explanation":"","verified":false},{"id":"q0480","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":5,"question":"Đoàn kết là điểm “mẹ”, điểm này mà thực hiện tốt thì đẻ ra con cháu đều tốt. là câu nói của:","options":["V.I.Lênin","Mác","Ph.Ăng ghen","Hồ Chí Minh"],"answer":null,"explanation":"","verified":false},{"id":"q0481","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":6,"question":"“Đại đoàn kết toàn dân tộc là đường lối chiến lược của cách mạng Việt Nam, là động lực và nguồn lực to lớn trong xây dựng và bảo vệ Tổ quổc” là:","options":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"answer":null,"explanation":"","verified":false},{"id":"q0482","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":7,"question":"“Mục đích chung đoàn kết toàn dân tộc: Nhằm phát huy mạnh mẽ mọi nguồn lực, mọi tiềm năng sáng tạo của nhân dân để xây dựng và bảo vệ Tổ quốc” là:","options":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"answer":null,"explanation":"","verified":false},{"id":"q0483","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":8,"question":"“Lấy mục tiêu xây dựng một nước Việt Nam hòa bình, độc lập, thống nhất, toàn vẹn lãnh thổ, dân giàu, nước mạnh, dân chủ, công bằng, văn minh” là:","options":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"answer":null,"explanation":"","verified":false},{"id":"q0484","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":9,"question":"“Mục đích chung đoàn kết toàn dân tộc: tôn trọng những điểm khác biệt không trái với lợi ích chung của quốc gia - dân tộc” là:","options":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"answer":null,"explanation":"","verified":false},{"id":"q0485","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":10,"question":"Theo Văn kiện Đại hội lần thứ XII của Đảng (1-2016) một trong những phương hướng cơ bản để phát huy khối đại đoàn kết dân tộc là:","options":["Tiếp tục thể chế hóa và cụ thể hóa các quan điểm, đường lối, chủ trương, chính sách của Đảng về đại đoàn kết toàn dân tộc","Hoàn thiện và thực hiện có hiệu quả các cơ chế, chính sách về kinh tế thị trường để tạo cho nền kinh tế phát triển","Bảo đảm mọi người dân đều có quyền tham gia phát triển kinh tế","Hoàn thiện các thiết chế văn hóa"],"answer":null,"explanation":"","verified":false},{"id":"q0486","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":11,"question":"Văn kiện Đại hội lần thứ XII của Đảng (1-2016) một trong những phương hướng để phát huy khối đại đoàn kết dân tộc là:","options":["Khắc phục những hạn chế, bảo đảm tác dụng, hiệu quả thực chất hoạt động giám sát, phản biện xã hội của Mặt trận Tổ quốc và các tổ chức chính trị - xã hôi","Tạo môi trường văn hóa lành mạnh để phát huy các giá trị truyền thống tốt đẹp của dân tộc","Bảo đảm mọi người dân đều có quyền tham gia phát triển văn hóa","Thực hiện tiến bộ và công bằng xã hội"],"answer":null,"explanation":"","verified":false},{"id":"q0487","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":12,"question":"“Đại đoàn kết toàn dân tộc phải dựa trên cơ sở giải quyết hài hòa quan hệ lợi ích giữa các thành viên trong xã hội” là:","options":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"answer":null,"explanation":"","verified":false},{"id":"q0488","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":13,"question":"“Đoàn kết trong Đảng là hạt nhân, là cơ sở vững chắc để xây dựng khối đại đoàn kết toàn dân tộ","options":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"answer":null,"explanation":"","verified":false},{"id":"q0489","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":14,"question":"“Đại đoàn kết toàn dân tộc là đường lối chiến lược của cách mạng Việt Nam, là động lực và nguồn lực to lớn trong xây dựng và bảo vệ Tổ quốc” là:","options":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"answer":null,"explanation":"","verified":false},{"id":"q0490","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":15,"question":"“Động lực chủ yếu để phát triển đất nước là đại đoàn kết dân tộc trên cơ sở liên mimh giữa công nhân với nông dân và trí thức do Đảng lãnh đạo” là:","options":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"answer":null,"explanation":"","verified":false},{"id":"q0491","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":16,"question":"“Đoàn kết là một truyền thống cực kỳ quý báu của Đảng ta và dân tA. Các đồng chí từ Trung ương đến các chi bộ cần phải giữ gìn sự đoàn kết nhất trí của Đảng như giữ gìn con ngươi của mắt mình”. Là câu nói của:","options":["Trường Chính","Võ Nguyên Giáp","Phạm Văn Đồng","Hồ Chí Minh"],"answer":null,"explanation":"","verified":false},{"id":"q0492","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":17,"question":"Về phương pháp thực hiện đại đoàn kết: Hồ Chí Minh xác định:","options":["Nên quan tâm đến lợi ích của quần chúng","Chỉ nên giáo dục tâm lý, nguyện vọng chung","Coi trọng việc tuyên truyền, giáo dục, vận động quần chúng.","Bắt quần chúng tham gia vào một nhóm"],"answer":null,"explanation":"","verified":false},{"id":"q0493","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":18,"question":"Một trong những nguyên nhân gây nên hạn chế trong công tác đoàn kết dân tộc là:","options":["Sức mạnh đại đoàn kết toàn dân tộc chưa được phát huy đầy đủ, có lúc, có nơi chưa phát huy được vai trò, sức mạnh của nhân dân.","Chủ trương, quan điểm của Đảng về Quốc phòng an ninh còn chưa được kịp thời thể chế hóa, hoặc đã thể chế hóa nhưng chưa được thực hiện nghiêm tú","Hoạt động của Hội phụ nữ có lúc, có nơi chưa sâu sát các tầng lớp nhân dân và cơ sở, còn có biểu hiện hành chính hóa, chưa thiết thực, hiệu quả.","Các đoàn thể còn hoạt động theo phong trào"],"answer":null,"explanation":"","verified":false},{"id":"q0494","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":19,"question":"Một trong những nguyên nhân gây nên hạn chế trong công tác đoàn kết dân tộc là:","options":["Chậm đổi mới nội dung, phương thức hoạt động của Mặt trận Tổ quốc và các đoàn thể nhân dân","Một bộ phận cán bộ, đảng viên, công chức, viên chức làm công tác đối ngoại chưa thật sự tôn trọng, lắng nghe ý kiến để giải quyết kịp thời, có hiệu quả những yêu cầu, nguyện vọng chính đáng của nhân dân.","Hệ thống pháp luật, cơ chế, chính sách để thể chế hóa đường lối, chủ trương, quan điểm của Đảng về Mặt trận Tổ quốc và các đoàn thể nhân dân về công tác đối ngoại còn thiếu và chưa đồng bộ.","Các đoàn thể chính trị còn hoạt động tự phát, theo phong trào"],"answer":null,"explanation":"","verified":false},{"id":"q0495","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":21,"question":"Quan điểm của Đảng về đại đoàn kết toàn dân tộc trong xây dựng và bảo vệ Tổ quốc trong Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển 2011) đã xác định:","options":["Bình đẳng, đoàn kết, tôn trọng và giúp đỡ nhau","Chống tư tưởng kỳ thị và chia rẽ dân tộc","Giữ gìn và phát huy bản sắc văn hoá, ngôn ngữ, truyền thống tốt đẹp của các dân tộc","Hạn chế sự giao lưu về văn hóa giữa các dân tộc để tránh mất bản sắc riêng"],"answer":null,"explanation":"","verified":false},{"id":"q0496","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":22,"question":"“Mặt trận Tổ quốc Việt Nam, các đoàn thể nhân dân có vai trò rất quan trọng trong sự nghiệp đại đoàn kết dân tộc; đại diện cho quyền và lợi ích hợp pháp của nhân dân” là:","options":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"answer":null,"explanation":"","verified":false},{"id":"q0497","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":23,"question":"“Đại đoàn kết toàn dân tộc lấy mục tiêu giữ vững độc lập, thống nhất của Tổ quốc, vì dân giàu, nước mạnh, xã hội công bằng, dân chủ, văn minh làm điểm tương đồng, xoá bỏ mặc cảm, định kiến, phân biệt đối xử về quá khứ, thành phần, giai cấp, xây dựng tinh thần cởi mở, tin cậy lẫn nhau, cùng hướng tới tương lai” là:","options":["Văn kiện đại hội X (2006)","Văn kiện đại hội XI (2011)","Văn kiện đại hội XII (2016)","Văn kiện đại hội XIII (2021)"],"answer":null,"explanation":"","verified":false},{"id":"q0498","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":24,"question":"Một trong những phương hướng phát huy sức mạnh đại đoàn kết dân tộc là:","options":["Thực hiện và phát huy dân chủ xã hội chủ nghĩa trong mọi lĩnh vực của đời sống xã hội","Giải phóng lao động, thiết lập một xã hội bình đẳng không phân biệt nam, nữ và dân tộc","Chăm lo công tác xây dựng Đảng","Phát triển tầng lớp trí thức"],"answer":null,"explanation":"","verified":false},{"id":"q0499","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":25,"question":"Một trong những phương hướng phát huy sức mạnh đại đoàn kết dân tộc là:","options":["Thường xuyên nâng cao giác ngộ về đại đoàn kết toàn dân tộc và cả hệ thống chính trị","Đấu tranh với mọi biểu hiện chống phá khối đại đoàn kết dân tộc","Tổ chức và động viên các tầng lớp nhân dân tham gia các phong trào thi đua yêu nước","Bám sát mục tiêu, yêu cầu, nhiệm vụ của cách mạng"],"answer":null,"explanation":"","verified":false},{"id":"q0500","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":26,"question":"Một trong những giải pháp phát huy sức mạnh đại đoàn kết dân tộc là:","options":["Thực hiện và phát huy dân chủ xã hội chủ nghĩa trong mọi lĩnh vực của đời sống xã hội","Giải phóng lao động, thiết lập một xã hội bình đẳng không phân biệt nam, nữ và dân tộc","Tổ chức và động viên các tầng lớp nhân dân tham gia các phong trào thi đua yêu nước","Bám sát mục tiêu, yêu cầu, nhiệm vụ của cách mạng"],"answer":null,"explanation":"","verified":false},{"id":"q0501","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":27,"question":"Một trong những giải pháp phát huy sức mạnh đại đoàn kết dân tộc là:","options":["Thường xuyên nâng cao giác ngộ về đại đoàn kết toàn dân tộc và cả hệ thống chính trị","Chăm lo công tác xây dựng Đảng","Phát triển tầng lớp trí thức","Xóa bỏ mặc cảm, định kiến quá khứ, thành phần giai cấp MỤC TIÊU 2: Làm rõ quan điểm, phương hướng của Đảng về đại đoàn kết dân tộc và bảo vệ Tổ quốc trong giai đoạn hiện nay Mức độ phân tích"],"answer":null,"explanation":"","verified":false},{"id":"q0502","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":28,"question":"Về ứng xử trong xây dựng khối đại đoàn kết toàn dân tộc để tập hợp, đoàn kết mọi người vào mặt trận chung, tăng cường đồng thuận xã hội, cần:","options":["Xóa bỏ mặc cảm, định kiến về quá khứ, thành phần giai cấp","Chấp nhận những điểm khác nhau không trái với lợi ích chung của dân tộc","Đề cao tinh thần dân tộc, truyền thống nhân nghĩa","Đề cao tinh thần dân tộc, xóa bỏ mặc cảm về quá khứ, thành phần giai cấp và chấp nhận những điểm khác nhau không trái với lợi ích chung của dân tộc"],"answer":null,"explanation":"","verified":false},{"id":"q0503","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":29,"question":"Một trong những giải pháp phát huy sức mạnh đại đoàn kết dân tộc là:","options":["Đấu tranh với mọi biểu hiện chống phá khối đại đoàn kết dân tộc","Giải phóng lao động, thiết lập một xã hội bình đẳng không phân biệt nam, nữ và dân tộc","Chấp nhận những điểm khác nhau không trái với lợi ích chung của dân tộc","Đề cao tinh thần dân tộc, truyền thống nhân nghĩa"],"answer":null,"explanation":"","verified":false},{"id":"q0504","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":30,"question":"Chọn phương án trả lời đúng nhất. Để thực hiện đại đoàn kết dân tộc, sinh viên cần:","options":["Tích cực phát huy các truyền thống quý báu của dân tộc nhất là tinh thần yêu nước, tinh thần đoàn kết","Chấp hành nghiêm các chủ trương của Đảng, chính sách pháp luật của nhà nước, đấu tranh với các hành vi chia rẽ khối đại đoàn kết toàn dân tộc, chống phá Đảng, nhà nước…","Tích cực học tập, lao động, rèn luyện đạo đức để trở thành người công dân tốt, người lao động tốt","Tích cực phát huy các truyền thống quý báu của dân tộc, chấp hành các chủ trương của Đảng, pháp luật của nhà nước và học tập, rèn luyện để trở thành người công dân tốt"],"answer":null,"explanation":"","verified":false},{"id":"q0505","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":31,"question":"Có bao nhiêu giải pháp về phát huy sức mạnh đại đoàn kết toàn dân tộc hiện nay?","options":["01 giải pháp","02 giải pháp","03 giải pháp","04 giải pháp"],"answer":null,"explanation":"","verified":false},{"id":"q0506","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":32,"question":"Để phát huy sức mạnh đại đoàn kết toàn dân tộc, đối với giai cấp công nhân cần phải thực hiện nội dung nào sau đây?","options":["Đảng, nhà nước tiếp tục quan tâm giáo dục, đào tạo, bồi dưỡng, phát triển giai cấp công nhân cả về số lượng và chất lượng","Nâng cao đời sống vật chất, tinh thần cho người dân để mọi người có thể phát triển toàn diện","Bảo đảm mọi quyền lợi về phát triển kinh tế - xã hội cho người dân","Hoàn thiện các thiết chế văn hóa"],"answer":null,"explanation":"","verified":false},{"id":"q0507","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":33,"question":"Chọn phương án trả lời đúng nhất. Cơ sở xây dựng khối đại đoàn kết dân tộc là:","options":["Thực hiện và phát huy dân chủ xã hội chủ nghĩa","Tổ chức và động viên các tầng lớp nhân dân tham gia các phong trào thi đua yêu nước","Đảm bảo hài hòa các lợi ích chính đáng, hợp pháp của các giai cấp, tầng lớp, các dân tộc","Tạo môi trường thuận lợi để các thành phần kinh tế phát triển"],"answer":null,"explanation":"","verified":false},{"id":"q0508","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":34,"question":"Để phát huy sức mạnh đại đoàn kết toàn dân tộc, đối với giai cấp nông dân cần:","options":["Xây dựng, phát huy vai trò của giai cấp nông dân, chủ thể của quá trình phát triển nông nghiệp, xây dựng nông thôn mới","Hỗ trợ cho hoạt động giáo dục phát triển","Tăng cường các dịch vụ trong đời sống xã hội","Hỗ trợ về vốn, khoa học kỹ thuật"],"answer":null,"explanation":"","verified":false},{"id":"q0509","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":35,"question":"Chọn phương án trả lời đúng nhất. Vị trí của khối đại đoàn kết dân tộc là:","options":["Động lực của cách mạng","Vừa là chiến lược cơ bản lâu dài, vừa là vấn đề cấp bách của cách mạng","Mục tiêu của cách mạng","Nhiệm vụ của cách mạng"],"answer":null,"explanation":"","verified":false},{"id":"q0510","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":36,"question":"Để phát huy sức mạnh đại đoàn kết toàn dân tộc, đối với giai cấp công nhân cần:","options":["Bảo đảm việc làm, nâng cao thu nhập, cải thiện điều kiện làm việc, nhà ở, các công trình phúc lợi phục vụ cho công nhân","Bổ sung các chính sách, pháp luật về tiền lương, bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp","Cải thiện chất lượng cuộc sống của dân cư nông thôn","Nâng cao bản lĩnh chính trị, trình độ học vấn, chuyên môn, kỹ năng nghề nghiệp, tác phong công nghiệp, kỷ luật lao động của công nhân"],"answer":null,"explanation":"","verified":false},{"id":"q0511","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":37,"question":"Chọn phương án trả lời đúng nhất. Chủ thể xây dựng khối đại đoàn kết dân tộc là:","options":["Toàn thể dân tộc, của cả hệ thống chính trị mà hạt nhân lãnh đạo là Đảng cộng sản Việt Nam","Giai cấp công nhân","Giai cấp nông dân","Tầng lớp trí thức"],"answer":null,"explanation":"","verified":false},{"id":"q0512","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":38,"question":"Để phát huy sức mạnh đại đoàn kết toàn dân tộc đối với đối với đội ngũ trí thức cần:","options":["Tôn trọng và phát huy tự do tư tưởng trong hoạt động nghiên cứu, sáng tạo.","Tôn trọng ý kiến của mọi người trong quá trình phát triển","Hoàn thiện các văn bản luật liên quan đến kinh tế thị trường để phát triển kinh tế","Hỗ trợ về vốn, khoa học kỹ thuật trong quá trình nghiên cứu"],"answer":null,"explanation":"","verified":false},{"id":"q0513","lesson":"BÀI 8","lessonTitle":"Phát huy sức mạnh khối đại đoàn kết toàn dân tộc","number":39,"question":"Chọn phương án trả lời đúng nhất. Nguyên tắc đoàn kết dân tộc là:","options":["Giai cấp công và giai cấp nông dân","Dựa trên nền tảng liên minh giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức do Đảng cộng sản Việt Nam lãn const STORAGE_KEY='chinhtri2025_v1';
let state=loadState(),page='home',session=null,flashIndex=0,flashFlipped=false,examTimer=null;
function loadState(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x&&Array.isArray(x.questions))return x}catch(e){}return {questions:INITIAL_QUESTIONS.map(q=>({...q})),history:[],wrong:{},seen:{},theme:'light',lastBackup:null}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));updateCount()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function updateCount(){document.getElementById('bankCount').textContent=state.questions.length+' câu hỏi'}
function toast(s){const root=document.getElementById('toastRoot');root.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>root.innerHTML='',2600)}
function setTheme(){document.documentElement.dataset.theme=state.theme;document.getElementById('themeBtn').textContent=state.theme==='dark'?'☀':'◐'}
function lessonCounts(){const m={};state.questions.forEach(q=>m[q.lesson]=(m[q.lesson]||0)+1);return m}
function getStats(){let attempted=Object.keys(state.seen).length,correct=0,wrong=Object.keys(state.wrong).length;state.questions.forEach(q=>{if(state.seen[q.id]&&q.answer!==null&&state.seen[q.id].last===q.answer)correct++});return {attempted,correct,wrong,verified:state.questions.filter(q=>q.answer!==null&&q.verified).length}}
function nav(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function head(title,sub,extra=''){return `<div class="pagehead"><div><div class="eyebrow">GIÁO DỤC CHÍNH TRỊ · 2025</div><h1>${title}</h1><p class="sub">${sub}</p></div>${extra}</div>`}
function render(){setTheme();updateCount();const main=document.getElementById('main');if(page==='home')main.innerHTML=homeView();else if(page==='practice')main.innerHTML=practiceSetup();else if(page==='exam')main.innerHTML=examSetup();else if(page==='wrong')main.innerHTML=wrongView();else if(page==='flash')main.innerHTML=flashView();else if(page==='stats')main.innerHTML=statsView();else if(page==='manage')main.innerHTML=manageView();else if(page==='session')main.innerHTML=sessionView();}
function homeView(){const s=getStats(),counts=lessonCounts(),all=state.questions.length,progress=all?Math.round(s.attempted/all*100):0;return head('Tổng quan học tập','Theo dõi tiến độ và tiếp tục ôn tập')+`<div class="grid stats-grid"><div class="card stat"><div><div class="label">Tổng câu hỏi</div><div class="value">${all}</div></div><div class="bubble">▤</div></div><div class="card stat"><div><div class="label">Đã luyện tập</div><div class="value">${s.attempted}</div></div><div class="bubble">✎</div></div><div class="card stat"><div><div class="label">Đáp án đã xác minh</div><div class="value">${s.verified}</div></div><div class="bubble">✓</div></div><div class="card stat"><div><div class="label">Câu cần ôn</div><div class="value">${s.wrong}</div></div><div class="bubble">↻</div></div></div><div class="grid quick-grid"><div class="card quick" onclick="nav('practice')"><div class="bubble">✎</div><div><strong>Luyện tập</strong><small>Ôn theo bài hoặc ngẫu nhiên</small></div></div><div class="card quick" onclick="nav('exam')"><div class="bubble">◷</div><div><strong>Thi thử</strong><small>Làm đề có giới hạn thời gian</small></div></div><div class="card quick" onclick="nav('flash')"><div class="bubble">▤</div><div><strong>Flashcard</strong><small>Ghi nhớ câu hỏi và đáp án</small></div></div></div><div class="card" style="margin-bottom:18px"><div class="stat"><div><div class="section-title" style="margin:0">Tiến độ ngân hàng câu hỏi</div><div class="muted" style="font-size:12px">${s.attempted}/${all} câu đã được mở luyện tập</div></div><strong>${progress}%</strong></div><div class="progress"><span style="width:${progress}%"></span></div><p class="muted" style="font-size:12px;margin:12px 0 0">Lưu ý: tài liệu gốc không có đáp án chuẩn đi kèm. Các câu chưa được quản trị xác minh sẽ được đánh dấu “Chưa có đáp án”.</p></div><h3 class="section-title">Danh sách bài học</h3><div class="grid lesson-grid">${LESSON_TITLES.map(([key,name],i)=>{let n=counts[key]||0,done=state.questions.filter(q=>q.lesson===key&&state.seen[q.id]).length;return `<div class="card lesson-card" onclick="startPractice('${key}')"><div class="lesson-no">${i===0?'MĐ':key.replace('BÀI ','B')}</div><div class="lesson-info"><strong>${esc(name)}</strong><small>${n} câu · ${done} đã luyện</small><div class="progress"><span style="width:${n?done/n*100:0}%"></span></div></div><span class="arrow">›</span></div>`}).join('')}</div>`}
function practiceSetup(){return head('Luyện tập trắc nghiệm','Chọn bài học, số câu và chế độ luyện tập')+`<div class="card" style="max-width:850px"><div class="formgrid"><div class="formrow"><label>Phạm vi bài học</label><select class="field" id="practiceLesson"><option value="all">Tất cả bài học</option>${LESSON_TITLES.map(([k,n])=>`<option value="${k}">${esc(k+' · '+n)}</option>`).join('')}</select></div><div class="formrow"><label>Số lượng câu hỏi</label><select class="field" id="practiceCount"><option>20</option><option>30</option><option>50</option><option>100</option><option>150</option><option>200</option><option value="all">Tất cả câu hỏi</option></select></div><div class="formrow"><label>Thứ tự câu hỏi</label><select class="field" id="practiceOrder"><option value="random">Ngẫu nhiên</option><option value="original">Theo thứ tự tài liệu</option><option value="unseen">Câu chưa luyện</option><option value="wrong">Câu đã sai</option></select></div><div class="formrow"><label>Trộn phương án</label><select class="field" id="practiceShuffle"><option value="yes">Có</option><option value="no">Không</option></select></div></div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn primary" onclick="beginPractice()">Bắt đầu luyện tập →</button></div></div>`}
function examSetup(){return head('Thi thử','Tạo đề ngẫu nhiên và tự động chấm các câu đã có đáp án xác minh')+`<div class="card" style="max-width:850px"><div class="formgrid"><div class="formrow"><label>Số câu trong đề</label><select class="field" id="examCount"><option>20</option><option>30</option><option>50</option><option>100</option><option>150</option><option>200</option></select></div><div class="formrow"><label>Thời gian (phút)</label><select class="field" id="examTime"><option>15</option><option>30</option><option selected>45</option><option>60</option><option>90</option><option>120</option></select></div><div class="formrow"><label>Phạm vi</label><select class="field" id="examLesson"><option value="all">Tất cả bài học</option>${LESSON_TITLES.map(([k,n])=>`<option value="${k}">${esc(k+' · '+n)}</option>`).join('')}</select></div></div><div class="feedback" style="margin-top:15px">Đề thi vẫn có thể chứa câu chưa xác minh đáp án. Các câu này được tính vào số câu chưa chấm, không bị tính sai.</div><div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn primary" onclick="beginExam()">Bắt đầu thi →</button></div></div>`}
function startPractice(lesson='all'){nav('practice');setTimeout(()=>{const e=document.getElementById('practiceLesson');if(e)e.value=lesson;},0)}
function shuffled(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function beginPractice(){let lesson=document.getElementById('practiceLesson').value,count=document.getElementById('practiceCount').value,order=document.getElementById('practiceOrder').value,shuffle=document.getElementById('practiceShuffle').value==='yes';let arr=state.questions.filter(q=>(lesson==='all'||q.lesson===lesson));if(order==='unseen')arr=arr.filter(q=>!state.seen[q.id]);if(order==='wrong')arr=arr.filter(q=>state.wrong[q.id]);if(order==='random')arr=shuffled(arr);if(count!=='all')arr=arr.slice(0,+count);if(!arr.length){toast('Không có câu hỏi phù hợp với lựa chọn');return}session={type:'practice',items:arr.map(q=>({...q,displayOptions:shuffle?shuffled(q.options.map((v,i)=>({v,orig:i}))):q.options.map((v,i)=>({v,orig:i}))})),answers:{},index:0,submitted:false};nav('session')}
function beginExam(){let count=+document.getElementById('examCount').value,mins=+document.getElementById('examTime').value,lesson=document.getElementById('examLesson').value;let arr=shuffled(state.questions.filter(q=>lesson==='all'||q.lesson===lesson)).slice(0,count);if(!arr.length){toast('Không có câu hỏi');return}session={type:'exam',items:arr.map(q=>({...q,displayOptions:shuffled(q.options.map((v,i)=>({v,orig:i})))})),answers:{},index:0,submitted:false,seconds:mins*60};nav('session');startTimer()}
function startTimer(){clearInterval(examTimer);examTimer=setInterval(()=>{if(!session||session.submitted){clearInterval(examTimer);return}session.seconds--;const t=document.getElementById('timer');if(t)t.textContent=formatTime(session.seconds);if(session.seconds<=0){clearInterval(examTimer);submitSession(true)}},1000)}
function formatTime(s){return Math.floor(Math.max(0,s)/60).toString().padStart(2,'0')+':'+(Math.max(0,s)%60).toString().padStart(2,'0')}
function sessionView(){if(!session)return '<div class="empty">Không có phiên học.</div>';if(session.submitted)return resultView();let q=session.items[session.index],chosen=session.answers[q.id];let verified=q.answer!==null&&q.verified;return head(session.type==='exam'?'Bài thi thử':'Đang luyện tập',`${esc(q.lessonTitle)} · Câu ${q.number}`,session.type==='exam'?`<div class="timer" id="timer">${formatTime(session.seconds)}</div>`:'')+`<div class="card question-card"><div class="qtop"><span>${session.index+1} / ${session.items.length}</span><span>${verified?'<span class="pill ok">Đã xác minh đáp án</span>':'<span class="pill warn">Chưa có đáp án xác minh</span>'}</span></div><div class="progress"><span style="width:${(session.index+1)/session.items.length*100}%"></span></div><div class="qtext">${esc(q.question)}</div><div>${q.displayOptions.map((o,i)=>{let cl=chosen===o.orig?' selected':'';if(session.type==='practice'&&chosen!==undefined&&verified){if(o.orig===q.answer)cl=' correct';else if(chosen===o.orig)cl=' wrong'}return `<button class="option${cl}" ${session.type==='practice'&&chosen!==undefined?'disabled':''} onclick="chooseAnswer(${o.orig})"><span class="letter">${'ABCD'[i]}</span><span>${esc(o.v)}</span></button>`}).join('')}</div>${session.type==='practice'&&chosen!==undefined?`<div class="feedback ${verified?(chosen===q.answer?'good':'bad'):''}">${verified?(chosen===q.answer?'✓ Chính xác!':'✕ Chưa chính xác. Đáp án đúng: '+ 'ABCD'[q.answer]):'Đáp án câu này chưa được xác minh trong ngân hàng. Bạn có thể bổ sung đáp án tại mục Quản lý câu hỏi.'}${q.explanation?'<br><br>'+esc(q.explanation):''}</div>`:''}<div class="qactions"><button class="btn" onclick="moveQuestion(-1)" ${session.index===0?'disabled':''}>← Câu trước</button><span class="qcounter">${chosen===undefined?'Chưa chọn đáp án':'Đã chọn đáp án'}</span>${session.index===session.items.length-1?`<button class="btn primary" onclick="submitSession(false)">${session.type==='exam'?'Nộp bài':'Hoàn thành'} ✓</button>`:`<button class="btn primary" onclick="moveQuestion(1)">Câu tiếp theo →</button>`}</div><div style="display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="btn ghost" onclick="toggleFlag('${q.id}')">${state.wrong[q.id]?'✓ Đã đánh dấu cần ôn':'⚑ Đánh dấu cần ôn'}</button>${session.type==='exam'?`<button class="btn danger" onclick="submitSession(false)">Nộp bài thi</button>`:''}</div></div>`}
function chooseAnswer(i){if(!session||session.submitted)return;let q=session.items[session.index];if(session.type==='practice'&&session.answers[q.id]!==undefined)return;session.answers[q.id]=i;state.seen[q.id]={last:i,at:Date.now()};if(q.answer!==null&&q.verified){if(i===q.answer)delete state.wrong[q.id];else state.wrong[q.id]=true}save();render()}
function moveQuestion(d){session.index=Math.max(0,Math.min(session.items.length-1,session.index+d));render();if(session.type==='exam')startTimerKeep()}
function startTimerKeep(){const t=document.getElementById('timer');if(t)t.textContent=formatTime(session.seconds)}
function toggleFlag(id){if(state.wrong[id])delete state.wrong[id];else state.wrong[id]=true;save();render();toast('Đã cập nhật danh sách cần ôn')}
function submitSession(auto){if(!session||session.submitted)return;session.submitted=true;clearInterval(examTimer);let total=0,correct=0,unknown=0;session.items.forEach(q=>{let a=session.answers[q.id];if(q.answer!==null&&q.verified){total++;if(a===q.answer)correct++;else if(a!==undefined)state.wrong[q.id]=true}else unknown++});let rec={date:Date.now(),type:session.type,total:session.items.length,graded:total,correct,unknown,answered:Object.keys(session.answers).length};state.history.unshift(rec);state.history=state.history.slice(0,100);save();render();if(auto)toast('Hết giờ — bài thi đã tự động nộp')}
function resultView(){let s=session.items.reduce((a,q)=>{if(q.answer!==null&&q.verified){a.graded++;if(session.answers[q.id]===q.answer)a.correct++;}else a.unknown++;if(session.answers[q.id]!==undefined)a.answered++;return a},{graded:0,correct:0,unknown:0,answered:0});return head('Kết quả '+(session.type==='exam'?'thi thử':'luyện tập'),'Đã hoàn thành phiên học')+`<div class="card" style="max-width:800px;margin:auto"><div class="grid stats-grid"><div><div class="muted">Câu đúng</div><div class="value" style="font-size:27px;color:var(--green)">${s.correct}</div></div><div><div class="muted">Đã chấm</div><div class="value" style="font-size:27px">${s.graded}</div></div><div><div class="muted">Chưa xác minh</div><div class="value" style="font-size:27px;color:var(--amber)">${s.unknown}</div></div><div><div class="muted">Đã trả lời</div><div class="value" style="font-size:27px">${s.answered}/${session.items.length}</div></div></div><h3 class="section-title">Xem lại câu hỏi</h3>${session.items.map((q,i)=>{let a=session.answers[q.id],v=q.answer!==null&&q.verified;return `<div style="padding:12px 0;border-top:1px solid var(--line)"><strong>${i+1}. ${esc(q.question)}</strong><div class="muted" style="font-size:12px;margin-top:5px">Bạn chọn: ${a===undefined?'Chưa trả lời':'ABCD'[a]} · ${v?'Đáp án: '+ 'ABCD'[q.answer]:'Chưa có đáp án xác minh'}</div></div>`}).join('')}<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px"><button class="btn primary" onclick="session=null;nav('practice')">Luyện tập tiếp</button><button class="btn" onclick="session=null;nav('home')">Về tổng quan</button></div></div>`}
function wrongView(){let arr=state.questions.filter(q=>state.wrong[q.id]);return head('Câu hỏi cần ôn','Các câu bạn đã đánh dấu hoặc trả lời sai')+`<div class="toolbar"><span class="pill">${arr.length} câu</span><button class="btn primary" onclick="practiceWrong()" ${!arr.length?'disabled':''}>Luyện các câu này</button><button class="btn" onclick="clearWrong()" ${!arr.length?'disabled':''}>Xóa danh sách</button></div>${arr.length?`<div class="card tablewrap"><table class="table"><thead><tr><th>Bài</th><th>Câu hỏi</th><th>Trạng thái đáp án</th><th></th></tr></thead><tbody>${arr.map(q=>`<tr><td>${esc(q.lesson)}</td><td>${esc(q.question)}</td><td>${q.verified?'<span class="pill ok">Đã xác minh</span>':'<span class="pill warn">Chưa xác minh</span>'}</td><td><button class="btn" onclick="editQuestion('${q.id}')">Sửa</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty"><div class="big">✓</div>Chưa có câu hỏi nào trong danh sách cần ôn.</div>'}`}
function practiceWrong(){let arr=state.questions.filter(q=>state.wrong[q.id]);if(!arr.length)return;session={type:'practice',items:shuffled(arr).map(q=>({...q,displayOptions:shuffled(q.options.map((v,i)=>({v,orig:i})))})),answers:{},index:0,submitted:false};nav('session')}
function clearWrong(){if(confirm('Xóa toàn bộ danh sách câu cần ôn?')){state.wrong={};save();render()}}
function flashView(){let arr=state.questions.filter(q=>q.answer!==null&&q.verified);if(!arr.length)return head('Flashcard','Ôn ghi nhớ bằng thẻ câu hỏi – đáp án')+`<div class="card empty"><div class="big">▤</div>Chưa có flashcard có đáp án xác minh. Hãy nhập đáp án trong mục Ngân hàng câu hỏi để sử dụng chức năng này.</div>`;flashIndex=Math.min(flashIndex,arr.length-1);let q=arr[flashIndex];return head('Flashcard','Chỉ hiển thị các câu đã có đáp án xác minh')+`<div class="card flash"><div class="qtop"><span>${q.lesson} · ${flashIndex+1}/${arr.length}</span><span class="pill ok">Đã xác minh</span></div><div class="front">${esc(flashFlipped?q.options[q.answer]:q.question)}</div>${flashFlipped?`<div class="back">Đáp án ${'ABCD'[q.answer]}${q.explanation?'<br>'+esc(q.explanation):''}</div>`:''}<div class="qactions"><button class="btn" onclick="flashMove(-1)">← Trước</button><button class="btn primary" onclick="flashFlipped=!flashFlipped;render()">${flashFlipped?'Xem câu hỏi':'Lật thẻ'}</button><button class="btn" onclick="flashMove(1)">Tiếp →</button></div></div>`}
function flashMove(d){let n=state.questions.filter(q=>q.answer!==null&&q.verified).length;flashIndex=(flashIndex+d+n)%n;flashFlipped=false;render()}
function statsView(){let s=getStats(),hist=state.history;return head('Thống kê học tập','Lịch sử luyện tập và mức độ hoàn thành')+`<div class="grid stats-grid"><div class="card"><div class="muted">Đã mở luyện tập</div><div class="value">${s.attempted}</div></div><div class="card"><div class="muted">Câu đã xác minh</div><div class="value">${s.verified}</div></div><div class="card"><div class="muted">Câu cần ôn</div><div class="value">${s.wrong}</div></div><div class="card"><div class="muted">Số phiên học</div><div class="value">${hist.length}</div></div></div><div class="card"><h3 class="section-title">Lịch sử gần đây</h3>${hist.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Thời gian</th><th>Loại</th><th>Số câu</th><th>Đã chấm</th><th>Đúng</th><th>Chưa xác minh</th></tr></thead><tbody>${hist.map(h=>`<tr><td>${new Date(h.date).toLocaleString('vi-VN')}</td><td>${h.type==='exam'?'Thi thử':'Luyện tập'}</td><td>${h.total}</td><td>${h.graded}</td><td>${h.correct}</td><td>${h.unknown}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có lịch sử học tập.</div>'}</div>`}
function manageView(){let search=document.getElementById('manageSearch')?.value||'',lesson=document.getElementById('manageLesson')?.value||'all',filter=document.getElementById('manageFilter')?.value||'all';let arr=state.questions.filter(q=>(lesson==='all'||q.lesson===lesson)&&(filter==='all'||(filter==='missing'?q.answer===null:filter==='verified'?q.verified:false))&&(!search||norm(q.question).includes(norm(search))||norm(q.options.join(' ')).includes(norm(search))));return head('Ngân hàng câu hỏi','Quản lý nội dung, bổ sung đáp án và cập nhật dữ liệu')+`<div class="toolbar"><input class="field search" id="manageSearch" placeholder="Tìm nội dung câu hỏi..." value="${esc(search)}" oninput="refreshManage()"><select class="field" id="manageLesson" onchange="render()"><option value="all">Tất cả bài</option>${LESSON_TITLES.map(([k,n])=>`<option value="${k}" ${lesson===k?'selected':''}>${esc(k)}</option>`).join('')}</select><select class="field" id="manageFilter" onchange="render()"><option value="all" ${filter==='all'?'selected':''}>Tất cả trạng thái</option><option value="missing" ${filter==='missing'?'selected':''}>Thiếu đáp án</option><option value="verified" ${filter==='verified'?'selected':''}>Đã xác minh</option></select><button class="btn primary" onclick="editQuestion(null)">＋ Thêm câu</button></div><div class="toolbar"><span class="pill">Hiển thị ${arr.length}/${state.questions.length}</span><button class="btn" onclick="exportQuestions()">Xuất ngân hàng JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">Nhập JSON</button><input type="file" id="importFile" accept="application/json,.json" class="hidden" onchange="importQuestions(this)"></div><div class="card tablewrap"><table class="table"><thead><tr><th>Bài / số câu</th><th>Nội dung</th><th>Đáp án đúng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${arr.slice(0,250).map(q=>`<tr><td><strong>${esc(q.lesson)}</strong><br><small class="muted">Câu ${q.number}</small></td><td>${esc(q.question.slice(0,180))}${q.question.length>180?'…':''}</td><td><select class="field answer-select" onchange="setAnswer('${q.id}',this.value)"><option value="">Chưa đặt</option>${['A','B','C','D'].map((l,i)=>`<option value="${i}" ${q.answer===i?'selected':''}>${l}</option>`).join('')}</select></td><td>${q.verified?'<span class="pill ok">Đã xác minh</span>':'<span class="pill warn">Chưa xác minh</span>'}</td><td><button class="btn" onclick="editQuestion('${q.id}')">Sửa</button></td></tr>`).join('')}</tbody></table>${arr.length>250?'<p class="muted">Đang hiển thị 250 kết quả đầu tiên. Hãy tìm kiếm để thu hẹp danh sách.</p>':''}</div><p class="muted" style="font-size:12px;margin-top:12px">Đáp án chỉ được dùng để chấm điểm và tạo flashcard khi bạn đánh dấu xác minh. Hãy đối chiếu tài liệu/giáo trình trước khi xác minh.</p>`}
function refreshManage(){let x=document.getElementById('manageSearch');let y=x?.selectionStart;render();let z=document.getElementById('manageSearch');z?.focus();if(z&&y!==undefined)z.setSelectionRange(y,y)}
function setAnswer(id,val){let q=state.questions.find(x=>x.id===id);if(!q)return;q.answer=val===''?null:+val;q.verified=val!=='';save();toast(val===''?'Đã bỏ đáp án':'Đã lưu đáp án và đánh dấu xác minh')}
function editQuestion(id){let q=id?state.questions.find(x=>x.id===id):{id:'',lesson:'BÀI MỞ ĐẦU',number:state.questions.length+1,question:'',options:['','','',''],answer:null,explanation:'',verified:false};if(!q)return;document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${id?'Chỉnh sửa câu hỏi':'Thêm câu hỏi mới'}</h2><div class="formgrid"><div class="formrow"><label>Bài học</label><select class="field" id="editLesson">${LESSON_TITLES.map(([k,n])=>`<option value="${k}" ${q.lesson===k?'selected':''}>${esc(k+' · '+n)}</option>`).join('')}</select></div><div class="formrow"><label>Số câu gốc</label><input class="field" id="editNumber" type="number" value="${q.number}"></div><div class="formrow full"><label>Nội dung câu hỏi</label><textarea class="field" id="editQuestion">${esc(q.question)}</textarea></div>${['A','B','C','D'].map((l,i)=>`<div class="formrow"><label>Phương án ${l}</label><textarea class="field" id="editOpt${i}">${esc(q.options[i]||'')}</textarea></div>`).join('')}<div class="formrow"><label>Đáp án đúng</label><select class="field" id="editAnswer"><option value="">Chưa xác định</option>${['A','B','C','D'].map((l,i)=>`<option value="${i}" ${q.answer===i?'selected':''}>${l}</option>`).join('')}</select></div><div class="formrow"><label>Trạng thái xác minh</label><select class="field" id="editVerified"><option value="no" ${!q.verified?'selected':''}>Chưa xác minh</option><option value="yes" ${q.verified?'selected':''}>Đã đối chiếu và xác minh</option></select></div><div class="formrow full"><label>Giải thích đáp án (không bắt buộc)</label><textarea class="field" id="editExplanation">${esc(q.explanation||'')}</textarea></div></div><div class="modal-actions">${id?'<button class="btn danger" onclick="deleteQuestion(\''+id+'\')">Xóa câu</button>':''}<button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="saveQuestion('${id||''}')">Lưu câu hỏi</button></div></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function saveQuestion(id){let question=document.getElementById('editQuestion').value.trim(),options=[0,1,2,3].map(i=>document.getElementById('editOpt'+i).value.trim());if(!question||options.some(x=>!x)){toast('Vui lòng nhập câu hỏi và đủ 4 phương án');return}let ans=document.getElementById('editAnswer').value,lesson=document.getElementById('editLesson').value;let obj={id:id||'custom-'+Date.now(),lesson,lessonTitle:LESSON_TITLES.find(x=>x[0]===lesson)?.[1]||lesson,number:+document.getElementById('editNumber').value||1,question,options,answer:ans===''?null:+ans,verified:ans!==''&&document.getElementById('editVerified').value==='yes',explanation:document.getElementById('editExplanation').value.trim()};if(id){let i=state.questions.findIndex(x=>x.id===id);state.questions[i]=obj}else state.questions.push(obj);save();closeModal();render();toast('Đã lưu câu hỏi')}
function deleteQuestion(id){if(!confirm('Xóa câu hỏi này?'))return;state.questions=state.questions.filter(q=>q.id!==id);delete state.wrong[id];delete state.seen[id];save();closeModal();render();toast('Đã xóa câu hỏi')}
function exportQuestions(){download('ngan-hang-cau-hoi-chinh-tri.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),questions:state.questions},null,2),'application/json')}
function backup(){download('sao-luu-on-thi-chinh-tri.json',JSON.stringify(state,null,2),'application/json');toast('Đã tạo bản sao lưu')}
function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function importQuestions(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result),incoming=Array.isArray(data)?data:data.questions;if(!Array.isArray(incoming))throw Error('Không tìm thấy mảng questions');let n=0;incoming.forEach(q=>{if(!q.question||!Array.isArray(q.options)||q.options.length!==4)return;let old=state.questions.findIndex(x=>x.id===q.id);if(old>=0)state.questions[old]={...state.questions[old],...q};else{q.id=q.id||'import-'+Date.now()+'-'+n;state.questions.push(q)}n++});save();render();toast('Đã nhập/cập nhật '+n+' câu hỏi')}catch(e){alert('File JSON không hợp lệ: '+e.message)}};r.readAsText(f);input.value=''}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));document.getElementById('backupBtn').addEventListener('click',backup);
document.getElementById('themeBtn').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';save();setTheme()});

render();
</script></body></html>
